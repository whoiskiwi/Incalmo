# ============================================================
# SEGMENTED Equifax range -- paper-faithful topology (PLAN Appendix C, step C.5.1).
# ------------------------------------------------------------
# Keeps the original docker-compose.yml (flat labnet) intact as the baseline.
# Bring this one up with an explicit -f and -p so it does NOT collide with the
# flat range:
#     docker compose -f docker-compose.segmented.yml -p equifax-seg up -d --build
#
# Topology (PLAN C.2):
#     extnet 10.0.0.0/24                  intnet 192.168.1.0/24 (internal, no egress)
#       [attacker 10.0.0.50] -> [ webserver ] -> [ database 192.168.1.100 ]
#                               10.0.0.2 / 192.168.1.2   ^ db cannot route back to attacker
# ============================================================

services:
  caldera:
    image: caldera:server
    networks:
      extnet:
        ipv4_address: 10.0.0.10
    ports:
      - "8888:8888"
    volumes:
      - caldera_equifax_conf:/usr/src/app/conf
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  database:
    build: ./database
    networks:
      intnet:
        ipv4_address: 192.168.1.100      # ONLY on the internal net

  webserver:
    build: ./webserver
    networks:                            # DUAL-HOMED = the only bridge ext <-> int
      extnet:
        ipv4_address: 10.0.0.2
      intnet:
        ipv4_address: 192.168.1.2
    ports:
      - "8080:8080"
    depends_on:
      - database

  attacker:
    build:
      context: ./attacker
    environment:
      - INCALMO_CONFIG=/incalmo/config/config.json
      - CALDERA_URL=http://10.0.0.10:8888
    networks:
      extnet:
        ipv4_address: 10.0.0.50
    ports:
      - "9000:9000"
    volumes:
      - ../incalmo:/incalmo/incalmo:ro
      - ../main.py:/incalmo/main.py:ro
      - ../config:/incalmo/config:ro
      - ../output:/incalmo/output
      - ../.env:/incalmo/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      caldera:
        condition: service_healthy
    command: ["sleep", "infinity"]

volumes:
  caldera_equifax_conf:

networks:
  extnet:                                # external: attacker <-> webserver
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
  intnet:                                # internal: webserver <-> database ONLY
    driver: bridge
    internal: true                       # ★ KEY: no route to host / no external egress
    ipam:
      config:
        - subnet: 192.168.1.0/24
